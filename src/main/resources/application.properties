# MariaDB DataSource Configuration
spring.application.name=DSFW_team_proj

# The port where the web app will be ran
server.port=8081

# =================================================================
# DATABASE CONFIGURATION - SECURITY ENHANCED
# =================================================================
# Uses environment variables if available, falls back to defaults for local testing
# See Security Report Section 3.2 for mitigation details
# =================================================================

spring.datasource.url=jdbc:mariadb://localhost:3306/dsfw_team_proj
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:comsc}

# Explanation:
# ${DB_USERNAME:root} means:
# - Try to read environment variable DB_USERNAME
# - If not found, use 'root' as default
# This allows secure deployment while maintaining assessor convenience

spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.defer-datasource-initialization=true

# SECURITY: SQL query logging disabled to prevent information leakage
# See Security Report Section 3.2.1 for details
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Initialize database with data.sql
spring.sql.init.mode=never

