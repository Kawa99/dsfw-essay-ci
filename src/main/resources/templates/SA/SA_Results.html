<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Self-Assessment Result</title>
</head>
<body>


<h1>Assessment Results</h1>

  <div th:each="submission, rowStat : ${assessmentData}" class="card mb-3">
    <div class="card-header">
      <h4>Submission #<span th:text="${rowStat.count}">1</span></h4>
    </div>
    <div class="card-body">
      <table class="table table-bordered">
        <thead>
        <tr>
          <th>Question ID</th>
          <th>Score Given</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entry : ${submission}">
          <td th:text="'Question ' + ${entry.key}">Question 101</td>

          <td>
            <span th:text="${entry.value}">5</span> / 5
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
