<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Digital Skills Self Assessment</title>
    <link rel="stylesheet" th:href="@{/self-assessment.css}" />
</head>
<body>

<div th:replace="~{'fragments/HeaderAndFooter' :: mainHeader}"></div>

<main>
    <h1>Digital Skills Self-Assessment</h1>
    <p style="margin-bottom: 30px; font-size: 1.2rem; color: #555;">
        Rate your confidence level for each skill statement below.
    </p>

    <form action="#" method="post">

        <div th:each="entry : ${assessmentData}" class="category-section">
            <h2 th:text="${entry.key.name}">Category Name</h2>

            <div th:each="skill : ${entry.value}" class="question-block">
                <span class="question-text" th:text="${skill.name}">Question Text</span>

                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" th:name="'skill_' + ${skill.id}" value="1" required>
                        1 (Low)
                    </label>

                    <label class="radio-option">
                        <input type="radio" th:name="'skill_' + ${skill.id}" value="2">
                        2
                    </label>

                    <label class="radio-option">
                        <input type="radio" th:name="'skill_' + ${skill.id}" value="3">
                        3
                    </label>

                    <label class="radio-option">
                        <input type="radio" th:name="'skill_' + ${skill.id}" value="4">
                        4
                    </label>

                    <label class="radio-option">
                        <input type="radio" th:name="'skill_' + ${skill.id}" value="5">
                        5 (High)
                    </label>
                </div>
            </div>
        </div>

        <button type="submit">Submit Assessment</button>
    </form>
</main>

<div th:replace="~{'fragments/HeaderAndFooter' :: mainFooter}"></div>

</body>
</html>
