<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-10">

<div class="max-w-4xl mx-auto bg-white p-8 rounded-2xl shadow-md">

    <h1 class="text-3xl font-bold text-gray-800 mb-2">
        Welcome, <span class="text-indigo-600" th:text="${user.firstName}">User</span>!
    </h1>

    <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-6 mt-6">
        <h2 class="text-lg font-semibold text-gray-700 mb-4">Current Session Details</h2>

        <ul class="space-y-2">
            <li class="flex items-center">
                <span class="w-24 font-medium text-gray-500">First Name:</span>
                <span class="text-gray-800" th:text="${user.firstName}"></span>
            </li>
            <li class="flex items-center">
                <span class="w-24 font-medium text-gray-500">Last Name:</span>
                <span class="text-gray-800" th:text="${user.lastName}"></span>
            </li>
            <li class="flex items-center">
                <span class="w-24 font-medium text-gray-500">Email:</span>
                <span class="text-gray-800 font-mono bg-white px-2 py-1 rounded border" th:text="${user.email}"></span>
            </li>
            <li class="flex items-center">
                <span class="w-24 font-medium text-gray-500">User ID:</span>
                <span class="text-gray-800" th:text="${user.id}"></span>
            </li>
        </ul>
    </div>

    <div class="mt-8">
        <a th:href="@{/login}" class="text-red-500 hover:text-red-700 font-medium">Logout / Switch User</a>
    </div>
</div>

</body>
</html>
