<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Registration</title>
  <!-- Bootstrap CSS for quick styling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow">
        <div class="card-header bg-primary text-white text-center">
          <h3>Register Account</h3>
        </div>
        <div class="card-body">

          <!-- Form connects to your RegistrationController -->
          <form name="register_form" action="/register" method="post" th:object="${user}">

            <div class="mb-3">
              <label class="form-label">First Name</label>
              <input type="text" class="form-control" th:field="*{firstName}" placeholder="Enter first name" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-control" th:field="*{lastName}" placeholder="Enter last name" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" th:field="*{email}" placeholder="Enter email" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" class="form-control" th:field="*{password}" placeholder="Enter password" required />
            </div>

            <button type="submit" class="btn btn-success w-100">Register</button>
          </form>

          <div class="text-center mt-3">
            <span>Already registered? <a href="/login">Login here</a></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
