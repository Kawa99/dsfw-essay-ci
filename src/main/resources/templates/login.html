<!DOCTYPE html>
<html lang="en" class="govuk-template" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sign in - Digital Skills for Wales</title>

    <link rel="icon" type="image/x-icon" th:href="@{/govuk-assets/images/favicon.ico}">
    <link rel="icon" type="image/svg+xml" th:href="@{/govuk-assets/images/govuk-logotype-crown.svg}">
    <link rel="apple-touch-icon" sizes="180x180" th:href="@{/govuk-assets/images/govuk-apple-touch-icon-180x180.png}">
    <link rel="mask-icon" color="#0b0c0c" th:href="@{/govuk-assets/images/govuk-mask-icon.svg}">
    <meta name="theme-color" content="#0b0c0c">

    <link rel="stylesheet" th:href="@{/styles/govuk-frontend.css}">
    <link rel="stylesheet" th:href="@{/styles/global.css}">
    <link rel="stylesheet" th:href="@{/styles/header-footer.css}">
</head>
<body class="govuk-template__body">

<a class="govuk-skip-link" href="#main-content">Skip to main content</a>

<div class="dsfw-page">
    <div th:replace="~{fragments/HeaderAndFooter :: mainHeader}"></div>

    <div class="govuk-width-container">
        <main class="govuk-main-wrapper" id="main-content" role="main">
            <div class="govuk-grid-row">
                <div class="govuk-grid-column-two-thirds">
                    <h1 class="govuk-heading-xl">Sign in</h1>
                    <p class="govuk-body">Use your work email address to access Digital Skills for Wales.</p>

                    <div th:if="${message}" class="govuk-notification-banner govuk-notification-banner--success" role="alert" aria-labelledby="govuk-notification-banner-title" data-module="govuk-notification-banner">
                        <div class="govuk-notification-banner__header">
                            <h2 class="govuk-notification-banner__title" id="govuk-notification-banner-title">Success</h2>
                        </div>
                        <div class="govuk-notification-banner__content">
                            <p class="govuk-notification-banner__heading" th:text="${message}">Message text</p>
                        </div>
                    </div>

                    <div th:if="${param.error}" class="govuk-error-summary" role="alert" aria-labelledby="login-error-title" data-module="govuk-error-summary">
                        <div role="alert">
                            <h2 class="govuk-error-summary__title" id="login-error-title">There is a problem</h2>
                            <div class="govuk-error-summary__body">
                                <p class="govuk-body">Invalid email or password.</p>
                            </div>
                        </div>
                    </div>

                    <form id="login-form" th:action="@{/login}" method="post" novalidate>
                        <div class="govuk-form-group">
                            <label class="govuk-label" for="email">Email address</label>
                            <div id="email-hint" class="govuk-hint">Use your public sector work email.</div>
                            <input class="govuk-input govuk-!-width-two-thirds" id="email" name="email" type="email" autocomplete="email" spellcheck="false" aria-describedby="email-hint" required>
                        </div>

                        <div class="govuk-form-group">
                            <label class="govuk-label" for="password">Password</label>
                            <input class="govuk-input govuk-!-width-two-thirds" id="password" name="password" type="password" autocomplete="current-password" required>
                        </div>

                        <button type="submit" class="govuk-button" data-module="govuk-button">Sign in</button>
                    </form>

                    <p class="govuk-body govuk-!-margin-top-6">
                        Need an account?
                        <a th:href="@{/register}" class="govuk-link">Create one now</a>.
                    </p>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/HeaderAndFooter :: mainFooter}"></div>
</div>

<script th:src="@{/scripts/govuk-frontend.js}"></script>
<script th:src="@{/scripts/gov-init.js}"></script>
</body>
</html>
