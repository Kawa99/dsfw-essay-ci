<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <!-- Bootstrap CSS for consistent styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="message" th:if="${message}">
                    <p th:text="${message}" ></p>
                </div>

                <div class="card-header bg-primary text-white text-center">
                    <h3>Sign In</h3>
                </div>
                <div class="card-body">

                    <!-- Login Form -->
                    <!-- Action must match your SecurityConfig logic (default is /login) -->
                    <form name="login_form" action="/login" method="post" th:object="${user}">

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" th:field="*{email}" class="form-control" name="username" placeholder="Enter email" required autofocus />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" th:field="*{password}" class="form-control" name="password" placeholder="Enter password" required />
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Log In</button>
                    </form>

                    <div class="text-center mt-3">
                        <span>Don't have an account? <a href="/register">Register here</a></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
