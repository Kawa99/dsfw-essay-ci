<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Notification Center - Digital Skills for Wales</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <link rel="stylesheet" th:href="@{/styles/govuk-frontend.css}">
    <link rel="stylesheet" th:href="@{/styles/global.css}">
    <link rel="stylesheet" th:href="@{/styles/header-footer.css}">
    <link rel="stylesheet" th:href="@{/styles/notification/notifications.css}">

</head>

<body class="govuk-template__body dsfw-page">

<div th:replace="~{fragments/HeaderAndFooter :: mainHeader}"></div>

<div class="govuk-width-container">

    <a href="/" class="govuk-back-link">Back to Dashboard</a>

    <main class="govuk-main-wrapper" id="main-content" role="main">
        <div class="govuk-grid-row">
            <div class="govuk-grid-column-two-thirds">

                <h1 class="govuk-heading-l">Notifications</h1>

                <div th:if="${not #lists.isEmpty(notifications)}">
                    <ul class="notification-list">
                        <li class="notification-item" th:each="notification : ${notifications}">
                                <span class="notification-date">
                                    <span class="govuk-visually-hidden">Received on </span>
                                    <span th:text="${#temporals.format(notification.timestamp, 'dd MMM yyyy, HH:mm')}"></span>
                                </span>

                            <span class="notification-message">
                                    <span class="notification-icon" aria-hidden="true"></span>
                                    <span th:text="${notification.message}"></span>
                                </span>
                        </li>
                    </ul>
                </div>

                <div th:if="${#lists.isEmpty(notifications)}" class="govuk-inset-text">
                    You have no new notifications at this time.
                </div>

            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/HeaderAndFooter :: mainFooter}"></div>

<script th:src="@{/scripts/govuk-frontend.js}"></script>
</body>
</html>
