<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Self-Assessment Admin</title>
    <meta charset="UTF-8" />
</head>

<body>

<div th:replace="~{fragments/HeaderAndFooter :: mainHeader}"></div>

<main>

    <h1>Self-Assessment Configuration</h1>

    <div th:if="${error}">
        <p th:text="${error}" style="color: red;"></p>
    </div>

    <div>
        <h2>Categories</h2>

        <table border="1" cellpadding="5" style="border-collapse: collapse; width: 100%;">
            <thead>
            <tr>
                <th>Category</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="category : ${categories}">
                <td>
                    <form th:action="@{'/admin/self-assessment/categories/' + ${category.id} + '/edit'}" method="post" style="display:inline;">
                        <input type="text" name="name" th:value="${category.name}" />
                        <button type="submit">Save</button>
                    </form>
                </td>
                <td>
                    <form th:action="@{'/admin/self-assessment/categories/' + ${category.id} + '/deactivate'}" method="post" style="display:inline;">
                        <button type="submit">Deactivate</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div style="margin-top: 10px;">
            <form th:action="@{'/admin/self-assessment/categories/add'}" method="post">
                <input type="text" name="name" placeholder="New category name" required />
                <button type="submit">Add Category</button>
            </form>
        </div>
    </div>

    <hr>

    <div>
        <h2>Skills / Questions</h2>

        <div th:each="category : ${categories}" style="margin-bottom: 20px;">
            <h3 th:text="${category.name}"></h3>

            <table border="1" cellpadding="5" style="border-collapse: collapse; width: 100%;">
                <thead>
                <tr>
                    <th>Skill / Question Text</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="skill : ${skillsByCategory[category.id]}">
                    <td>
                        <form th:action="@{'/admin/self-assessment/skills/' + ${skill.id} + '/edit'}" method="post" style="display:inline;">
                            <input type="text" name="name" th:value="${skill.name}" style="width: 300px;" />
                            <button type="submit">Save</button>
                        </form>
                    </td>

                    <td>
                        <form th:action="@{'/admin/self-assessment/skills/' + ${skill.id} + '/deactivate'}" method="post" style="display:inline;">
                            <button type="submit">Deactivate</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>

            <div style="margin-top: 5px;">
                <form th:action="@{'/admin/self-assessment/skills/add'}" method="post">
                    <input type="hidden" name="categoryId" th:value="${category.id}" />
                    <input type="text" name="name" placeholder="New skill/question" required style="width: 300px;" />
                    <button type="submit">Add Skill</button>
                </form>
            </div>
        </div>
    </div>

</main>

<div th:replace="~{fragments/HeaderAndFooter :: mainFooter}"></div>

</body>
</html>
