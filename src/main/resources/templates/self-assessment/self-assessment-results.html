<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>Self-Assessment Result</title>
  <link href="styles/self-assessment/self-assessment-results.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

 <div class="container">

    <h1>Assessment Results</h1>

    <div class="card mb-3" th:each="submission, rowStat : ${assessmentData}">

      <div class="card-header">
        <h4>Submission #<span th:text="${rowStat.count}">1</span></h4>
      </div>

      <div class="card-body">

        <table class="table table-bordered">

          <thead>
          <tr>
            <th>Question ID</th>
            <th>Score Given</th>
          </tr>
          </thead>

          <tbody>
          <!-- Using iterStat for now until we fix database issues -->
          <tr th:each="entry, iterStat : ${submission}">
            <td th:text="'Question ' + ${iterStat.count}">Question 101</td>

            <td>
              <span th:text="${entry.value}">5</span> / 5
            </td>
          </tr>
          </tbody>

        </table>

      </div>

    </div>

 </div>


</body>
</html>
