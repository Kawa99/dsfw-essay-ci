<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0c0c">
    <title>Self-Assessment Result</title>

    <link rel="icon" type="image/x-icon" th:href="@{/govuk-assets/images/favicon.ico}">
    <link rel="mask-icon" color="#0b0c0c" th:href="@{/govuk-assets/images/govuk-mask-icon.svg}">

    <link rel="stylesheet" th:href="@{/styles/govuk-frontend.css}">
    <link rel="stylesheet" th:href="@{/styles/global.css}">
    <link rel="stylesheet" th:href="@{/styles/header-footer.css}">
    <link rel="stylesheet" th:href="@{/styles/self-assessment/self-assessment-results.css}">
</head>

<body class="govuk-template__body dsfw-page">

  <div th:replace="~{'fragments/HeaderAndFooter' :: mainHeader}"></div>


  <div class="govuk-width-container dsfw-page">

    <main class="govuk-main-wrapper" id="main-content" role="main">

        <h1 class="govuk-heading-xl">Assessment Results</h1>

        <div th:if="${assessmentData.empty}" class="govuk-warning-text">
          <span class="govuk-warning-text__icon" aria-hidden="true">!</span>
          <strong class="govuk-warning-text__text">
            <span class="govuk-warning-text__assistive">Warning</span>
            No submissions found yet. Please take the assessment first.
          </strong>
        </div>


        <div th:each="submission, rowStat : ${assessmentData}" class="govuk-summary-card">


          <div class="govuk-summary-card__title-wrapper">
            <h2 class="govuk-summary-card__title">
              Submission #<span th:text="${submission.id}">1</span>
              <span class="govuk-caption-m" th:text="${#temporals.format(submission.submittedAt, 'dd-MM-yyyy HH:mm')}">Date</span>
            </h2>
          </div>


          <div class="govuk-summary-card__content">
            <table class="govuk-table">

              <tbody class="govuk-table__body">
              <tr th:each="response, iterStat : ${submission.responses}" class="govuk-table__row">

                <td class="govuk-table__cell" th:text="${response.skill.name}">Question Text</td>
                <td class="govuk-table__cell">
                  <strong class="govuk-tag"
                          th:classappend="${response.score >= 4 ? 'govuk-tag--green' : 'govuk-tag--yellow'}">
                    <span th:text="${response.score}"></span>
                  </strong>
                </td>

              </tr>
              </tbody>

            </table>
          </div>


        </div>

        <div class="govuk-button-group">
          <a href="/self-assessment" class="govuk-button" data-module="govuk-button">
            Take Assessment Again
          </a>
        </div>

    </main>
  </div>



  <div th:replace="~{'fragments/HeaderAndFooter' :: mainFooter}"></div>



  <script th:src="@{/scripts/govuk-frontend.js}"></script>
  <script th:src = "@{/scripts/gov-init.js}"></script>

</body>
</html>
