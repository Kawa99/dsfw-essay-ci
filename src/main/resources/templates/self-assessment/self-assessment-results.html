<!DOCTYPE html>
<html lang="en" class="govuk-template" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Self-Assessment Result</title>

    <link rel="icon" type="image/x-icon" th:href="@{/govuk-assets/images/favicon.ico}">
    <link rel="mask-icon" color="#0b0c0c" th:href="@{/govuk-assets/images/govuk-mask-icon.svg}">
    <meta name="theme-color" content="#0b0c0c">

    <link rel="stylesheet" th:href="@{/styles/govuk-frontend.css}">
    <link rel="stylesheet" th:href="@{/styles/global.css}">
    <link rel="stylesheet" th:href="@{/styles/header-footer.css}">
    <link rel="stylesheet" th:href="@{/styles/self-assessment/self-assessment-results.css}">
</head>
<body class="govuk-template__body">

<a class="govuk-skip-link" href="#main-content">Skip to main content</a>

<div class="dsfw-page">
    <div th:replace="~{fragments/HeaderAndFooter :: mainHeader}"></div>

    <div class="govuk-width-container">
        <main class="govuk-main-wrapper" id="main-content" role="main">
            <div class="govuk-grid-row">
                <div class="govuk-grid-column-two-thirds">
                    <h1 class="govuk-heading-xl">Assessment Results</h1>

                    <div th:each="submission, rowStat : ${assessmentData}" class="govuk-!-margin-bottom-6">

                        <h2 class="govuk-heading-m">
                            Submission #<span th:text="${rowStat.count}">1</span>
                        </h2>

                        <table class="govuk-table">
                            <thead class="govuk-table__head">
                            <tr class="govuk-table__row">
                                <th scope="col" class="govuk-table__header">Question ID</th>
                                <th scope="col" class="govuk-table__header">Score Given</th>
                            </tr>
                            </thead>
                            <tbody class="govuk-table__body">
                            <tr class="govuk-table__row" th:each="entry, iterStat : ${submission}">
                                <td class="govuk-table__cell" th:text="'Question ' + ${iterStat.count}">Question 101</td>
                                <td class="govuk-table__cell">
                                    <span th:text="${entry.value}">5</span> / 5
                                </td>
                            </tr>
                            </tbody>
                        </table>

                        <hr class="govuk-section-break govuk-section-break--l govuk-section-break--visible">
                    </div>

                    <div class="govuk-button-group">
                        <a th:href="@{/self-assessment}" class="govuk-button govuk-button--secondary">Back to Assessment</a>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/HeaderAndFooter :: mainFooter}"></div>
</div>

<script th:src="@{/scripts/govuk-frontend.js}"></script>
<script th:src="@{/scripts/govuk-init.js}"></script>
</body>
</html>
