<!DOCTYPE html>
<html lang="en" class="govuk-template" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Self-Assessment Admin</title>

    <link rel="icon" type="image/x-icon" th:href="@{/govuk-assets/images/favicon.ico}">
    <link rel="mask-icon" color="#0b0c0c" th:href="@{/govuk-assets/images/govuk-mask-icon.svg}">
    <meta name="theme-color" content="#0b0c0c">

    <link rel="stylesheet" th:href="@{/styles/govuk-frontend.css}">
    <link rel="stylesheet" th:href="@{/styles/global.css}">
    <link rel="stylesheet" th:href="@{/styles/header-footer.css}">
    <link rel="stylesheet" th:href="@{/styles/self-assessment/self-assessment-admin.css}" />
</head>

<body class="govuk-template__body">

<a class="govuk-skip-link" href="#main-content">Skip to main content</a>

<div class="dsfw-page">

    <div th:replace="~{fragments/HeaderAndFooter :: mainHeader}"></div>

    <div class="govuk-width-container">
        <main class="govuk-main-wrapper admin-page-wrapper" id="main-content" role="main">
            <h1 class="govuk-heading-xl page-title">Self-Assessment Configuration</h1>

            <div id="alertBox" class="alert"></div>

            <div th:if="${error}" class="govuk-error-summary">
                <div class="govuk-error-summary__body">
                    <p th:text="${error}"></p>
                </div>
            </div>

            <div class="settings-container">
                <div class="settings-nav">
                    <h3 class="govuk-heading-s">Categories</h3>
                    <div class="nav-item"
                         th:each="category : ${categories}"
                         th:data-category-id="${category.id}"
                         th:text="${category.name}">
                    </div>
                    <div class="nav-divider"></div>
                    <div class="nav-item" data-category-id="manage">Manage Categories</div>
                </div>

                <div class="settings-content">
                    <div th:each="category : ${categories}"
                         class="category-section"
                         th:data-category-id="${category.id}">

                        <div class="section-header">
                            <div>
                                <h2>
                                    <span th:id="'cat-name-' + ${category.id}" class="govuk-heading-m" th:text="${category.name}"></span>

                                    <form th:id="'cat-edit-' + ${category.id}"
                                          th:action="@{'/admin/self-assessment/categories/' + ${category.id} + '/edit'}"
                                          method="post"
                                          class="inline-edit-form">
                                        <input type="text" name="name" th:value="${category.name}" class="govuk-input govuk-input--width-20" required />
                                        <button type="submit" class="govuk-button govuk-button--secondary btn-small">Save</button>
                                        <button type="button"
                                                class="govuk-button govuk-button--secondary btn-small cancel-edit-category"
                                                th:data-category-id="${category.id}">Cancel</button>
                                    </form>
                                </h2>
                            </div>
                            <div class="action-buttons">
                                <form th:action="@{'/admin/self-assessment/categories/' + ${category.id} + '/deactivate'}"
                                      method="post"
                                      style="display:inline;"
                                      class="deactivate-form"
                                      data-item-type="category">
                                </form>
                            </div>
                        </div>

                        <table class="govuk-table">
                            <thead class="govuk-table__head">
                            <tr class="govuk-table__row">
                                <th class="govuk-table__header" style="width: 70%;">Skill / Question Text</th>
                                <th class="govuk-table__header">Actions</th>
                            </tr>
                            </thead>
                            <tbody class="govuk-table__body">
                            <tr class="govuk-table__row" th:each="skill : ${skillsByCategory[category.id]}">
                                <td class="govuk-table__cell">
                                    <span th:id="'skill-name-' + ${skill.id}" th:text="${skill.name}"></span>

                                    <form th:id="'skill-edit-' + ${skill.id}"
                                          th:action="@{'/admin/self-assessment/skills/' + ${skill.id} + '/edit'}"
                                          method="post"
                                          class="inline-edit-form">
                                        <input type="text" name="name" th:value="${skill.name}" class="govuk-input" required />
                                        <button type="submit" class="govuk-button govuk-button--secondary btn-small">Save</button>
                                        <button type="button"
                                                class="govuk-button govuk-button--secondary btn-small cancel-edit-skill"
                                                th:data-skill-id="${skill.id}">Cancel</button>
                                    </form>
                                </td>
                                <td class="govuk-table__cell">
                                    <div class="action-buttons">
                                        <button type="button"
                                                class="govuk-button govuk-button--secondary btn-small edit-skill-btn"
                                                th:data-skill-id="${skill.id}">Edit</button>
                                        <form th:action="@{'/admin/self-assessment/skills/' + ${skill.id} + '/deactivate'}"
                                              method="post"
                                              style="display:inline;"
                                              class="deactivate-form"
                                              data-item-type="skill">
                                            <button type="submit" class="govuk-button govuk-button--warning btn-small">Deactivate</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr class="govuk-table__row" th:if="${#lists.isEmpty(skillsByCategory[category.id])}">
                                <td colspan="2" class="govuk-table__cell" style="text-align: center; color: #999;">No skills in this category yet</td>
                            </tr>
                            </tbody>
                        </table>

                        <div class="add-new-section govuk-!-margin-top-4">
                            <h3 class="govuk-heading-s">Add New Skill/Question</h3>
                            <form th:action="@{'/admin/self-assessment/skills/add'}" method="post" class="add-form">
                                <input type="hidden" name="categoryId" th:value="${category.id}" />
                                <input type="text" name="name" class="govuk-input govuk-!-width-two-thirds" placeholder="Enter new skill or question text" required />
                                <button type="submit" class="govuk-button">Add Skill</button>
                            </form>
                        </div>
                    </div>

                    <div class="category-section manage-categories-section" data-category-id="manage">
                        <div class="section-header">
                            <h2 class="govuk-heading-m">Manage Categories</h2>
                        </div>

                        <table class="govuk-table">
                            <thead class="govuk-table__head">
                            <tr class="govuk-table__row">
                                <th class="govuk-table__header" style="width: 60%;">Category Name</th>
                                <th class="govuk-table__header">Skill Count</th>
                                <th class="govuk-table__header">Actions</th>
                            </tr>
                            </thead>
                            <tbody class="govuk-table__body">
                            <tr class="govuk-table__row" th:each="category : ${categories}">
                                <td class="govuk-table__cell" th:text="${category.name}"></td>
                                <td class="govuk-table__cell" th:text="${#lists.size(skillsByCategory[category.id])}"></td>
                                <td class="govuk-table__cell">
                                    <div class="action-buttons">
                                        <button type="button"
                                                class="govuk-button govuk-button--secondary btn-small edit-category-btn"
                                                th:data-category-id="${category.id}"
                                                onclick="document.querySelector('[data-category-id=\'' + this.dataset.categoryId + '\'].nav-item').click();">
                                            View/Edit
                                        </button>
                                        <form th:action="@{'/admin/self-assessment/categories/' + ${category.id} + '/deactivate'}"
                                              method="post"
                                              style="display:inline;"
                                              class="deactivate-form"
                                              data-item-type="category">
                                            <button type="submit" class="govuk-button govuk-button--warning btn-small">Deactivate</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>

                        <div class="add-new-section govuk-!-margin-top-4">
                            <h3 class="govuk-heading-s">Add New Category</h3>
                            <form th:action="@{'/admin/self-assessment/categories/add'}" method="post" class="add-form">
                                <input type="text" name="name" class="govuk-input govuk-!-width-one-half" placeholder="Enter new category name" required />
                                <button type="submit" class="govuk-button">Add Category</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <div th:replace="~{fragments/HeaderAndFooter :: mainFooter}"></div>
</div>

<script th:src="@{/scripts/govuk-frontend.js}"></script>
<script th:src="@{/scripts/govuk-init.js}"></script>
<script th:src="@{/scripts/self-assessment-admin.js}"></script>

</body>
</html>
