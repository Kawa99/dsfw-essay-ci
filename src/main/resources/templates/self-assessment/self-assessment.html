<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Digital Skills Self Assessment</title>
    <link rel="stylesheet" th:href="@{/styles/self-assessment/self-assessment.css}" />
</head>
<body>

<div th:replace="~{'fragments/HeaderAndFooter' :: mainHeader}"></div>

<main>
    <h1>Digital Skills Self-Assessment</h1>

    <p class="intro-text">
        Rate your confidence level for each skill statement below.
    </p>

    <form th:action="@{/self-assessment/submit}" th:object="${assessmentForm}" method="post">

        <div th:each="entry : ${assessmentData}" class="category-section">
            <h2 th:text="${entry.key.name}">Category Name</h2>

            <div th:each="skill : ${entry.value}" class="question-block">
                <span class="question-text" th:text="${skill.name}">Question Text</span>

                <div class="radio-group">
                    <span class="scale-text">I do not know this skill</span>

                    <label class="radio-option">
                        <input type="radio" th:field="*{answers[__${skill.id}__]}" value="1" required>
                        1
                    </label>

                    <label class="radio-option">
                        <input type="radio" th:field="*{answers[__${skill.id}__]}" value="2">
                        2
                    </label>

                    <label class="radio-option">
                        <input type="radio" th:field="*{answers[__${skill.id}__]}" value="3">
                        3
                    </label>

                    <label class="radio-option">
                        <input type="radio" th:field="*{answers[__${skill.id}__]}" value="4">
                        4
                    </label>

                    <label class="radio-option">
                        <input type="radio" th:field="*{answers[__${skill.id}__]}" value="5">
                        5
                    </label>

                    <span class="scale-text">I am proficient in this skill</span>
                </div>
            </div>
        </div>

        <button type="submit">Submit Assessment</button>
    </form>
</main>

<div th:replace="~{'fragments/HeaderAndFooter' :: mainFooter}"></div>

</body>
</html>
