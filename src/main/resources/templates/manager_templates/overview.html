<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manager Overview</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" th:href="@{/styles/header-footer.css}" />
    <link rel="stylesheet" th:href="@{/styles/manager/overview.css}" />
</head>

<body>

<div th:replace="~{'fragments/HeaderAndFooter' :: mainHeader}"></div>

<main class="manager-container">
    <h1>Team Self-Assessment Overview</h1>

    <table class="gov-table">
        <thead>
        <tr>
            <th scope="col" style="width: 10%">User ID</th>
            <th scope="col" style="width: 25%">Name</th>
            <th scope="col" style="width: 45%">Status</th>
            <th scope="col" style="width: 20%">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="emp : ${employees}">
            <td th:text="${emp.userID}"></td>

            <td th:text="${emp.name}" style="font-weight: bold;"></td>

            <td>
                <div th:if="${emp.submissionDate != null}">
                    <span class="status-tag status-complete">Submitted</span>
                    <span class="date-text"
                          th:text="'on ' + ${#temporals.format(emp.submissionDate, 'dd MMM yyyy')} + ' at ' + ${#temporals.format(emp.submissionDate, 'HH:mm')}">
                    </span>
                </div>
                <div th:if="${emp.submissionDate == null}">
                    <span class="status-tag status-pending">Pending</span>
                </div>
            </td>

            <td>
                <button type="button" class="btn-view">View Results</button>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="action-row">
        <a href="#" class="btn-cta">See all results</a>
    </div>

</main>

<div th:replace="~{'fragments/HeaderAndFooter' :: mainFooter}"></div>

</body>
</html>
