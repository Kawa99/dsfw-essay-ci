# Test database configuration - uses MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/dsfw_team_proj_test
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=comsc

# JPA/Hibernate settings for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Run data.sql on tests
spring.sql.init.mode=always

spring.jpa.properties.hibernate.check_nullability=true
spring.jpa.properties.jakarta.persistence.validation.mode=auto