image: eclipse-temurin:21-jdk

services:
  - name: mariadb:11
    alias: mariadb

variables:
  MARIADB_ROOT_PASSWORD: comsc
  MARIADB_DATABASE: dsfw_team_proj_test
  SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/dsfw_team_proj_test
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: comsc
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

build:
  stage: build
  tags:
    - general-docker
  cache:
    key: gradle
    paths:
      - .gradle/caches/
      - .gradle/wrapper/
  script:
    - ./gradlew clean test checkstyleMain bootJar
  artifacts:
    when: always
    paths:
      - build/libs/*.jar
      - build/reports/checkstyle/
    reports:
      junit: build/test-results/test/*.xml
